<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ここ2週間の活動まとめ</title>
<style>
    body {
        margin: 0;
        font-family: "Yu Gothic", sans-serif;
        background: url('https://images.unsplash.com/photo-1503264116251-35a269479413?auto=format&fit=crop&w=1600&q=80') no-repeat center/cover;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .slide {
        width: 70%;
        max-width: 900px;
        padding: 40px;
        border-radius: 20px;
        backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.25);
        box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        color: #fff;
        display: none;
        animation: fade 0.6s ease;
    }

    @keyframes fade {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .slide.active {
        display: block;
    }

    h1, h2 {
        margin-top: 0;
        font-weight: 600;
    }

    .nav {
        position: fixed;
        bottom: 30px;
        width: 100%;
        text-align: center;
    }

    .nav button {
        padding: 10px 20px;
        margin: 0 10px;
        border: none;
        border-radius: 10px;
        background: rgba(255,255,255,0.3);
        backdrop-filter: blur(8px);
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    .nav button:hover {
        background: rgba(255,255,255,0.5);
    }
</style>
</head>
<body>

<div class="slide active" id="slide1">
    <h1>ここ2週間の活動まとめ</h1>
    <p>2026/10/1〜10/14</p>
</div>

<div class="slide" id="slide2">
    <h2>学業（図書館学）</h2>
    <ul>
        <li>情報技術組織論レポート作成</li>
        <li>Webページデザイン調整（背景画像・ガラス風UI）</li>
        <li>HTML/CSS構造の整理</li>
    </ul>
</div>

<div class="slide" id="slide3">
    <h2>アルバイト</h2>
    <ul>
        <li>約40時間勤務</li>
        <li>新人対応</li>
        <li>書類整理・接客</li>
        <li>シフト調整</li>
    </ul>
</div>

<div class="slide" id="slide4">
    <h2>生活・趣味</h2>
    <ul>
        <li>読書（小説・資料）</li>
        <li>カフェで作業</li>
        <li>Pinterestで背景デザイン収集</li>
        <li>軽いストレッチ（運動不足改善）</li>
    </ul>
</div>

<div class="slide" id="slide5">
    <h2>成果と気づき</h2>
    <ul>
        <li>Webデザインの理解が向上</li>
        <li>レポートの方向性が固まった</li>
        <li>生活リズムの改善点が明確に</li>
    </ul>
</div>

<div class="nav">
    <button onclick="prevSlide()">前へ</button>
    <button onclick="nextSlide()">次へ</button>
</div>

<script>
    let current = 1;
    const total = 5;

    function showSlide(n) {
        document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
        document.getElementById(`slide${n}`).classList.add('active');
    }

    function nextSlide() {
        current = current === total ? 1 : current + 1;
        showSlide(current);
    }

    function prevSlide() {
        current = current === 1 ? total : current - 1;
        showSlide(current);
    }
</script>

</body>
</html>
